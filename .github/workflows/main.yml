name: Deploy to Production (shopserve)

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [microcms] # microCMS側のevent_typeも「microcms」に設定します
  workflow_dispatch:   # ← これを追加（画面から手動実行できるようになります）

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      # 1. 静的ファイルのビルド生成 (distフォルダに出力)
      - name: Build site
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: npm run build

      # 2. ショップサーブ（FTP）へ生成ファイル(dist)をアップロード
      - name: FTP Deploy to Shopserve
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }} # Secretsで柔軟に変更できるように設定
